<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מענה לדורות — Alpha v2</title><style>body{font-family:Arial,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f7f4ed;color:#172238}input{width:70%;padding:12px}button{padding:12px}.card{background:#fff;border:1px solid #ddd5c6;border-radius:12px;padding:14px;margin:12px 0}.muted{color:#667085;font-size:14px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:7px;text-align:right;vertical-align:top}</style></head><body><h1>מענה לדורות | Alpha v2</h1><p>מנוע ניסוי מבוסס propositions. התאמה מילולית לבדה אינה מספיקה.</p><label><input id="research" type="checkbox" style="width:auto"> מצב חוקר</label><p><input id="q" placeholder="כתבי שאלה"><button id="go">השיבי</button></p><div id="out"></div><script type="module">import{buildAnswerModel}from'./src/answer-engine.js';let INDEX=[];const out=document.getElementById('out'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./data/public-search-index.json').then(r=>r.json()).then(j=>INDEX=j.entries||[]);function src(e,i){return`<div class="card"><b>[${i+1}] ${esc(e.title||'מקור')}</b><div class="muted">${esc(e.date||'ללא תאריך')} · ${esc(e.language||'שפה לא סומנה')} · ${esc(e.status||'')} · context: ${esc(e.context_status||'unknown')} · family: ${esc(e.evidence_family_id||'—')}</div>${e.source_url?`<a href="${esc(e.source_url)}" target="_blank" rel="noopener">למקור ↗</a>`:''}</div>`}function render(){const q=document.getElementById('q').value.trim();if(!q)return;const mode=document.getElementById('research').checked?'researcher':'regular',m=buildAnswerModel(INDEX,q,{mode});if(!m.answerable){out.innerHTML=`<div class="card"><b>אין כרגע די ראיות קנוניות רלוונטיות כדי לענות בביטחון.</b><p class="muted">${esc(m.reason)}</p></div>`+(m.sources||[]).map(src).join('');return}const claims=m.claims.map(c=>`<li>${esc(c.text)} <b>[${c.source_numbers.join(',')}]</b></li>`).join('');let html=`<div class="card"><h2>${mode==='researcher'?'סקירה מחקרית מסונתזת':'תשובה מסונתזת מבוססת מקורות'}</h2><ul>${claims}</ul><p class="muted">הניסוח הוא סינתזה של המערכת מתוך המקורות ואינו ציטוט המיוחס לרבי.</p></div>`;if(mode==='researcher'){const r=m.research;html+=`<div class="card"><h3>Evidence map</h3><table><tr><th>מדד</th><th>ערך</th></tr><tr><td>Evidence Families</td><td>${r.evidence_families}</td></tr><tr><td>Verified</td><td>${r.verified_sources}/${m.sources.length}</td></tr><tr><td>הקשר חלקי</td><td>${r.partial_context_sources}</td></tr><tr><td>תקופות/תאריכים</td><td>${esc(r.periods.join(' · ')||'לא תועד')}</td></tr><tr><td>קהלים</td><td>${esc(r.audiences.join(' · ')||'לא תועד')}</td></tr><tr><td>סוגי מקור</td><td>${esc(r.source_classes.join(' · ')||'לא תועד')}</td></tr><tr><td>שפות מקור</td><td>${esc(r.languages.join(' · ')||'לא תועד')}</td></tr></table><h3>Witness provenance</h3>${r.witnesses.map(w=>`<p><b>${esc(w.family)}</b>: ${esc(w.provenance||'לא תועד')} · scope: ${esc(w.verification_scope||'לא תועד')} · ${esc(w.primary_secondary_status||'לא סווג')}</p>`).join('')}<h3>גבולות הראיות</h3><p>${m.insufficient_evidence.length?esc(m.insufficient_evidence.join(' · ')):'לא זוהה חסר מפורש מעבר למגבלות ההקשר המסומנות בכל מקור.'}</p></div>`}html+='<h3>מקורות</h3>'+m.sources.map(src).join('');out.innerHTML=html}document.getElementById('go').onclick=render;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')render()});</script></body></html>
