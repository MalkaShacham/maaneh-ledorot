<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מענה לדורות — Alpha v2</title><style>body{font-family:Arial,sans-serif;max-width:980px;margin:auto;padding:28px;background:#f7f4ed;color:#172238}input{width:70%;padding:12px}button{padding:12px}.card{background:#fff;border:1px solid #ddd5c6;border-radius:12px;padding:14px;margin:12px 0}.muted{color:#667085;font-size:14px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:7px;text-align:right;vertical-align:top}.ok{background:#eef8ef}.gap{background:#fff3e8}</style></head><body><h1>מענה לדורות | Alpha v2</h1><p>מנוע ניסוי מבוסס propositions. התאמה מילולית לבדה אינה מספיקה.</p><label><input id="research" type="checkbox" style="width:auto"> מצב חוקר</label><p><input id="q" placeholder="כתבי שאלה"><button id="go">השיבי</button></p><div id="out"></div><script type="module">import{buildAnswerModel}from'./src/answer-engine.js';let INDEX=[];const out=document.getElementById('out'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./data/public-search-index.json').then(r=>r.json()).then(j=>INDEX=j.entries||[]);function src(e,i){return`<div class="card"><b>[${i+1}] ${esc(e.title||'מקור')}</b><div class="muted">${esc(e.date||'ללא תאריך')} · ${esc(e.language||'שפה לא סומנה')} · ${esc(e.status||'')} · context: ${esc(e.context_status||'unknown')} · family: ${esc(e.evidence_family_id||'—')}</div>${e.source_url?`<a href="${esc(e.source_url)}" target="_blank" rel="noopener">למקור ↗</a>`:''}</div>`}function list(v,empty='לא תועד'){return v?.length?esc(v.join(' · ')):empty}function render(){const q=document.getElementById('q').value.trim();if(!q)return;const mode=document.getElementById('research').checked?'researcher':'regular',m=buildAnswerModel(INDEX,q,{mode});if(!m.answerable){out.innerHTML=`<div class="card"><b>אין כרגע די ראיות קנוניות רלוונטיות כדי לענות בביטחון.</b><p class="muted">${esc(m.reason)}</p></div>`+(m.sources||[]).map(src).join('');return}const claims=m.claims.map(c=>`<li>${esc(c.text)} <b>[${c.source_numbers.join(',')}]</b></li>`).join('');let html=`<div class="card"><h2>${mode==='researcher'?'סקירה מחקרית מסונתזת':'תשובה מסונתזת מבוססת מקורות'}</h2><ul>${claims}</ul><p class="muted">הניסוח הוא סינתזה של המערכת מתוך המקורות ואינו ציטוט המיוחס לרבי.</p></div>`;if(mode==='researcher'){const r=m.research;html+=`<div class="card"><h3>פירוק טענות וראיות</h3><table><tr><th>טענה מסונתזת</th><th>מקורות</th><th>Evidence Families</th><th>אימות</th><th>שלמות הקשר</th></tr>${m.claims.map(c=>`<tr><td>${esc(c.text)}</td><td>${c.source_numbers.map(n=>'['+n+']').join(' ')}</td><td>${list(c.evidence_family_ids)}</td><td>${list(c.verification_status)}</td><td>${list(c.context_status)}</td></tr>`).join('')}</table><h3>Evidence map</h3><table><tr><th>מדד</th><th>ערך</th></tr><tr><td>Evidence Families</td><td>${r.evidence_families}</td></tr><tr><td>Verified</td><td>${r.verified_sources}/${m.sources.length}</td></tr><tr><td>הקשר חלקי</td><td>${r.partial_context_sources}</td></tr><tr><td>תקופות/תאריכים</td><td>${list(r.periods)}</td></tr><tr><td>קהלים</td><td>${list(r.audiences)}</td></tr><tr><td>סוגי מקור</td><td>${list(r.source_classes)}</td></tr><tr><td>שפות מקור</td><td>${list(r.languages)}</td></tr><tr><td>Pipeline statuses</td><td>${list(r.pipeline_statuses)}</td></tr><tr><td>סיווג witnesses</td><td>${esc(Object.entries(r.witness_classes||{}).map(([k,v])=>k+': '+v).join(' · ')||'לא סווג')}</td></tr></table><h3>מה נענה ומה עדיין חסר</h3><table><tr class="ok"><th>נענה בראיות</th><td>${list(m.answered_well,'אין רכיב שסומן כמכוסה')}</td></tr><tr class="gap"><th>אין די ראיות</th><td>${list(m.insufficient_evidence,'לא זוהה חסר מפורש')}</td></tr></table><h3>Witness provenance</h3>${r.witnesses.map(w=>`<p><b>${esc(w.family)}</b>: ${esc(w.provenance||'לא תועד')} · scope: ${esc(w.verification_scope||'לא תועד')} · context: ${esc(w.context_status)} · language: ${esc(w.language||'לא תועד')} · class: ${esc(w.witness_class||'לא סווג')} · ${esc(w.primary_secondary_status||'לא סווג')}</p>`).join('')}</div>`}html+='<h3>מקורות</h3>'+m.sources.map(src).join('');out.innerHTML=html}document.getElementById('go').onclick=render;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')render()});</script></body></html>
