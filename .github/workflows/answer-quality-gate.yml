name: Answer quality gate

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ANSWER_ENGINE_SPEC.md'
      - 'data/public-search-index.json'
      - 'data/items/**'
      - 'data/evidence-families/**'
      - 'data/evaluation/**'
      - 'scripts/evaluate_answer_quality.py'
      - 'scripts/test_answer_*.mjs'
      - 'scripts/test_question_specificity_gate.mjs'
      - 'scripts/reconcile_metrics.py'
      - 'scripts/content_readiness.py'
      - 'scripts/test_content_readiness.mjs'
      - 'src/answer-engine.js'
      - 'src/answer-engine-validated.js'
      - '.github/workflows/answer-quality-gate.yml'
      - '.github/workflows/hourly-corpus-pipeline.yml'
      - '.github/workflows/reconcile-metrics.yml'
      - 'scripts/test_workflow_write_safety.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: answer-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate evidence index for this exact source revision
        run: python scripts/reconcile_metrics.py
      - name: Test question-specific retrieval
        run: node scripts/test_question_specificity_gate.mjs
      - name: Test answer synthesis
        run: node scripts/test_answer_synthesis.mjs
      - name: Test citation integrity
        run: node scripts/test_answer_integrity.mjs
      - name: Audit answer-engine evidence contract
        run: python scripts/evaluate_answer_quality.py
      - name: Test serialized workflow write safety
        run: python scripts/test_workflow_write_safety.py
      - name: Test measured content readiness and real-corpus answers
        run: node scripts/test_content_readiness.mjs
