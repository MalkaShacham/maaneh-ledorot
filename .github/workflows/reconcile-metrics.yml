name: Bulk promote and reconcile public metrics
on:
  push:
    branches: [main]
    paths:
      - 'data/items/**'
      - 'data/staging/batches/**'
      - 'data/staging/manifests/**'
      - 'scripts/reconcile_metrics.py'
      - 'scripts/bulk_promote_indexed.py'
      - '.github/workflows/reconcile-metrics.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Bulk-promote up to 200 actionable staging records safely to Indexed
        run: python scripts/bulk_promote_indexed.py
      - name: Reconcile metrics, backlog and public search index
        run: python scripts/reconcile_metrics.py
      - name: Commit bulk promotion and reconciled state if changed
        run: |
          if [ -z "$(git status --porcelain -- data/items data/public-metrics.json data/public-search-index.json data/project-state.json data/promotion-ready-reconciled.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add data/items data/public-metrics.json data/public-search-index.json data/project-state.json data/promotion-ready-reconciled.json
          git commit -m "Bulk-promote staging records and reconcile state"
          git push
