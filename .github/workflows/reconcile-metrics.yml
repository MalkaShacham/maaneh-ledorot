name: Reconcile public metrics
on:
  push:
    branches: [main]
    paths:
      - 'data/items/**'
      - 'data/staging/batches/**'
      - 'data/staging/manifests/**'
      - 'scripts/reconcile_metrics.py'
      - '.github/workflows/reconcile-metrics.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/reconcile_metrics.py
      - name: Commit reconciled state if changed
        run: |
          if [ -z "$(git status --porcelain -- data/public-metrics.json data/public-search-index.json data/project-state.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add data/public-metrics.json data/public-search-index.json data/project-state.json
          git commit -m "Reconcile public project metrics and state"
          git push
