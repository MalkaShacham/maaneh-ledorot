name: Hourly corpus production pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hourly_corpus_pipeline.py'
      - 'scripts/reconcile_metrics.py'
      - 'scripts/reconcile_identity_aliases.py'
      - '.github/workflows/hourly-corpus-pipeline.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-corpus-production
  cancel-in-progress: false

jobs:
  corpus-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run deterministic corpus maintenance
        run: python scripts/hourly_corpus_pipeline.py
      - name: Commit every auditable run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add data/items data/public-metrics.json data/public-search-index.json data/project-state.json data/promotion-ready-reconciled.json data/run-logs
          if git diff --cached --quiet; then
            echo "No tracked change was produced; this is unexpected because a run log should exist."
            exit 1
          fi
          git commit -m "Hourly corpus pipeline: $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase origin main
          git push origin HEAD:main
