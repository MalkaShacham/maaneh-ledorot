name: Hourly corpus production pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hourly_corpus_pipeline.py'
      - 'scripts/reconcile_metrics.py'
      - 'scripts/reconcile_identity_aliases.py'
      - '.github/workflows/hourly-corpus-pipeline.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corpus-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync latest main before mutation
        run: git pull --ff-only origin main
      - name: Run deterministic corpus maintenance
        run: python scripts/hourly_corpus_pipeline.py
      - name: Commit actionable corpus changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          ACTIONABLE_PATHS=(data/items data/public-metrics.json data/public-search-index.json data/project-state.json data/promotion-ready-reconciled.json)
          if git diff --quiet -- "${ACTIONABLE_PATHS[@]}"; then
            echo "No actionable corpus change; run-log-only changes are not committed."
            exit 0
          fi
          git add "${ACTIONABLE_PATHS[@]}" data/run-logs
          git commit -m "Hourly corpus pipeline: $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push origin HEAD:main
