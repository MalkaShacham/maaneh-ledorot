name: Hourly corpus maintenance

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hourly_corpus_pipeline.py'
      - 'scripts/acquire_source_content.py'
      - 'scripts/test_source_acquisition.py'
      - 'scripts/reconcile_metrics.py'
      - 'scripts/reconcile_identity_aliases.py'
      - 'scripts/content_readiness.py'
      - '.github/workflows/hourly-corpus-pipeline.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corpus-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync latest main before mutation
        run: git pull --ff-only origin main
      - name: Test acquisition boundaries
        run: python scripts/test_source_acquisition.py
      - name: Acquire bounded publisher content and reconcile corpus
        run: python scripts/hourly_corpus_pipeline.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the reconciled answer evidence before publication
        run: |
          python scripts/evaluate_answer_quality.py
          node scripts/test_content_readiness.mjs
          node scripts/test_answer_integrity.mjs
          node scripts/test_question_specificity_gate.mjs
      - name: Publish measured run outcome
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('data/run-logs/latest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Corpus maintenance outcome\n\n')
              f.write('Status: **'+r['status']+'**\n\n')
              f.write('This job attempts bounded publisher acquisition and exact excerpt checks; semantic verification of paraphrases is separate.\n\n')
              f.write('| Measure | Before | After | Delta |\n|---|---:|---:|---:|\n')
              for key in r['after']:
                  f.write(f"| {key} | {r['before'].get(key)} | {r['after'][key]} | {r['delta'].get(key)} |\n")
              if r.get('next_action'): f.write('\nRequired next action: '+r['next_action']+'\n')
          if r.get('acquisition'):
              print('Acquisition outcome: '+r['acquisition']['status'])
          if r['status']=='no_actionable_change':
              print('::warning title=No corpus progress::Maintenance finished without adding inspected content or sources. Content acquisition and review are still required.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-maintenance-run-${{ github.run_id }}
          path: |
            data/run-logs/latest.json
            data/acquisition/latest.json
          retention-days: 7
      - name: Commit actionable corpus changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          ACTIONABLE_PATHS=(data/items data/staging/batches data/acquisition data/public-metrics.json data/public-search-index.json data/project-state.json data/promotion-ready-reconciled.json data/content-review-queue.json data/evaluation/latest-quality-gate.json)
          if [ -z "$(git status --porcelain -- "${ACTIONABLE_PATHS[@]}")" ]; then
            echo "No actionable corpus change; run-log-only changes are not committed."
            exit 0
          fi
          git add "${ACTIONABLE_PATHS[@]}" data/run-logs
          git commit -m "Hourly corpus pipeline: $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push origin HEAD:main
